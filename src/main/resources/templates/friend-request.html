<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка в друзья</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button.accept {
            background-color: #4CAF50;
            color: white;
        }
        button.accept:hover {
            background-color: #45a049;
        }
        button.reject {
            background-color: #f44336;
            color: white;
        }
        button.reject:hover {
            background-color: #e53935;
        }
        button.block {
            background-color: #555;
            color: white;
        }
        button.block:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span th:text="${friendName}"></span> отправил(а) вам заявку в друзья!
        </h1>
        <div class="buttons">
            <button class="accept" onclick="handleActionFriendRequest('accept')">Принять</button>
            <button class="reject" onclick="handleActionFriendRequest('reject')">Отклонить</button>
            <button class="block" onclick="handleActionFriendRequest('block')">Заблокировать</button>
        </div>
    </div>

    <script>
        function handleActionFriendRequest(action) {
            // Отправляем действие на сервер
            fetch(`/friend-request/${action}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ friendName: document.querySelector('h1 span').innerText }),
            })
            .then(response => {
                if (response.ok) {
                    alert(`Заявка успешно обработана: ${action}`);
                } else {
                    alert('Произошла ошибка при обработке заявки');
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
            });
        }
    </script>
</body>
</html>
